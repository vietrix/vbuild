name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: mkdir -p bin
      - run: go build -o ./bin/vbuild ./cmd/vbuild
      - run: VBUILD_VAR_VERSION=${{ github.ref_name }} ./bin/vbuild test
      - run: chmod +x scripts/release.sh
      - run: VBUILD_VAR_VERSION=${{ github.ref_name }} ./bin/vbuild release
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
