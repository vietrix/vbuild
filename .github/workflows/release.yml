name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: chmod +x scripts/release.sh
      - run: VERSION=${{ github.ref_name }} scripts/release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
