workflow: "vbuild public"

vars:
  APP: vbuild
  VERSION: dev

env:
  CGO_ENABLED: "0"

tasks:
  default:
    desc: format and test
    deps: [format, test]

  format:
    desc: format Go code
    run:
      - gofmt -w .

  test:
    desc: run tests
    run:
      - go test ./...

  build:
    desc: build local binary
    run:
      - go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version={{VERSION}}" -o {{APP}} ./cmd/vbuild

  release:
    desc: build release binaries (unix)
    run:
      - VERSION={{VERSION}} ./scripts/release.sh

  release-windows:
    desc: build release binaries (windows)
    run:
      - $env:VERSION="{{VERSION}}"; .\\scripts\\release.ps1
