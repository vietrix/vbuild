workflow: "vbuild public"

vars:
  APP: vbuild
  VERSION: dev

env:
  CGO_ENABLED: "0"

tasks:
  default:
    desc: format and test
    deps: [format, test]

  format:
    desc: format Go code
    tags: [fmt]
    run:
      - gofmt -w .

  test:
    desc: run tests
    tags: [test]
    run:
      - go test ./...

  build:
    desc: build local binary
    tags: [build]
    inputs:
      - go.mod
      - go.sum
      - "**/*.go"
    outputs:
      - "{{APP}}"
    cache: mtime
    run:
      - go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version={{VERSION}}" -o {{APP}} ./cmd/vbuild

  release:
    desc: build release binaries (unix)
    tags: [release]
    outputs:
      - dist/*
    run:
      - |
        set -eu
        version="{{VERSION}}"
        mkdir -p dist
        checksum_cmd=""
        checksum_args=""
        if command -v sha256sum >/dev/null 2>&1; then
          checksum_cmd="sha256sum"
        elif command -v shasum >/dev/null 2>&1; then
          checksum_cmd="shasum"
          checksum_args="-a 256"
        else
          echo "sha256sum or shasum is required" >&2
          exit 1
        fi
        write_checksum() {
          file="$1"
          if [ -n "$checksum_args" ]; then
            (cd dist && $checksum_cmd $checksum_args "$file" > "$file.sha256")
          else
            (cd dist && $checksum_cmd "$file" > "$file.sha256")
          fi
        }
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
            -o "dist/linux-amd64-$version" ./cmd/vbuild
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
            -o "dist/linux-arm64-$version" ./cmd/vbuild
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
            -o "dist/darwin-amd64-$version" ./cmd/vbuild
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
            -o "dist/darwin-arm64-$version" ./cmd/vbuild
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
            -o "dist/windows-amd64-$version.exe" ./cmd/vbuild
        write_checksum "linux-amd64-$version"
        write_checksum "linux-arm64-$version"
        write_checksum "darwin-amd64-$version"
        write_checksum "darwin-arm64-$version"
        write_checksum "windows-amd64-$version.exe"

  release-windows:
    desc: build release binaries (windows)
    tags: [release]
    outputs:
      - dist/*
    run:
      - |
        $ErrorActionPreference = "Stop"
        $version = "{{VERSION}}"
        if ([string]::IsNullOrWhiteSpace($version)) {
          $version = "dev"
        }
        $distDir = "dist"
        if (-not (Test-Path $distDir)) {
          New-Item -ItemType Directory -Path $distDir | Out-Null
        }
        function Write-Checksum([string]$path, [string]$fileName) {
          $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLower()
          $line = "$hash  $fileName"
          $checksumPath = Join-Path $distDir "$fileName.sha256"
          Set-Content -Path $checksumPath -Value $line -Encoding ASCII
        }
        $env:CGO_ENABLED = "0"

        $env:GOOS = "linux"
        $env:GOARCH = "amd64"
        $out = Join-Path $distDir "linux-amd64-$version"
        go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o $out ./cmd/vbuild
        Write-Checksum $out "linux-amd64-$version"

        $env:GOOS = "linux"
        $env:GOARCH = "arm64"
        $out = Join-Path $distDir "linux-arm64-$version"
        go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o $out ./cmd/vbuild
        Write-Checksum $out "linux-arm64-$version"

        $env:GOOS = "darwin"
        $env:GOARCH = "amd64"
        $out = Join-Path $distDir "darwin-amd64-$version"
        go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o $out ./cmd/vbuild
        Write-Checksum $out "darwin-amd64-$version"

        $env:GOOS = "darwin"
        $env:GOARCH = "arm64"
        $out = Join-Path $distDir "darwin-arm64-$version"
        go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o $out ./cmd/vbuild
        Write-Checksum $out "darwin-arm64-$version"

        $env:GOOS = "windows"
        $env:GOARCH = "amd64"
        $out = Join-Path $distDir "windows-amd64-$version.exe"
        go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o $out ./cmd/vbuild
        Write-Checksum $out "windows-amd64-$version.exe"
